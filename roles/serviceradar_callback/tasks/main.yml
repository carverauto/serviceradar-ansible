---
- name: Reject direct-mode and callback-internal variable injection
  ansible.builtin.assert:
    that:
      - >-
        vars.keys() | select('match', '^sr_ra_') | list | length == 0
      - >-
        vars.keys() | select('match', '^sr_callback_|^_sr_cb_') | list | length == 0
      - sr_ra_ca_keys is not defined
      - sr_ra_accounts is not defined
      - sr_ra_target_identity is not defined
      - sr_ra_authorization is not defined
      - sr_ra_direct_confirmation is not defined
      - sr_ra_mode is not defined
      - sr_ra_phase is not defined
      - sr_ra_state is not defined
      - sr_ra_operation is not defined
      - _sr_ra_callback_ca_keys is not defined
      - _sr_ra_callback_accounts is not defined
      - _sr_ra_callback_target_identity is not defined
      - _sr_ra_callback_transaction is not defined
      - _sr_ra_callback_authorization is not defined
      - _sr_ra_callback_retirement_proof is not defined
      - _sr_ra_callback_phase is not defined
      - _sr_ra_callback_state is not defined
      - _sr_ra_callback_operation is not defined
      - vars.keys() | select('match', '^_sr_wrapper_') | list | length == 0
    fail_msg: >-
      Integrated wrappers do not accept direct policy or reserved callback values
      from inventory, surveys, or ordinary extra vars.
  run_once: true
  delegate_to: localhost

- name: Validate callback credential environment contract
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_URL') is
        match('^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?/api/v1/automation/callback-grants/[A-Za-z0-9._-]+/actions/remote_access\\.ssh_ca\\.bundle\\.read$')
      - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_GRANT') | length >= 32
      - >-
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_IDEMPOTENCY_KEY') is
        match('^[A-Za-z0-9._~-]{32,128}$')
      - >-
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_ALLOWED_ORIGIN') is
        match('^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$')
      - >-
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_URL').startswith(
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_ALLOWED_ORIGIN') ~ '/')
      - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_MANIFEST_SHA256') is match('^[a-f0-9]{64}$')
      - lookup('ansible.builtin.env', 'SERVICERADAR_SCM_REVISION') is match('^[a-f0-9]{40,64}$')
      - lookup('ansible.builtin.env', 'SERVICERADAR_CONTENT_SHA256') is match('^[a-f0-9]{64}$')
      - lookup('ansible.builtin.env', 'JOB_ID') is match('^[1-9][0-9]{0,18}$')
      - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE') in ['preflight', 'stage', 'verify', 'commit']
      - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_OPERATION') in ['enroll', 'overlap', 'retire', 'remove']
      - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_STATE') in ['present', 'absent']
      - >-
        (lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_STATE') == 'absent') ==
        (lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_OPERATION') == 'remove')
    fail_msg: >-
      The reviewed ephemeral AWX custom credential is absent or malformed.
      Ordinary URLs, tokens, user/API credentials, and proxy redirects are forbidden.
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Consume one-use public CA callback grant
  ansible.builtin.uri:
    url: "{{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_URL') }}"
    method: POST
    headers:
      Authorization: >-
        Bearer {{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_GRANT') }}
      Idempotency-Key: >-
        {{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_IDEMPOTENCY_KEY') }}
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      action: remote_access.ssh_ca.bundle.read
      schema_version: serviceradar.remote_access.ssh_ca_bundle/v1
      job_id: "{{ lookup('ansible.builtin.env', 'JOB_ID') | int }}"
      phase: "{{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE') }}"
      operation: "{{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_OPERATION') }}"
      state: "{{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_STATE') }}"
      manifest_sha256: >-
        {{ lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_MANIFEST_SHA256') }}
    return_content: true
    status_code: [200, 409]
    timeout: 5
    use_proxy: false
    validate_certs: true
    follow_redirects: none
  register: sr_callback_response
  until: sr_callback_response.status | default(0) == 200
  retries: 30
  delay: 1
  no_log: true
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost

- name: Validate bounded callback response envelope
  ansible.builtin.assert:
    that:
      - sr_callback_response.status == 200
      - sr_callback_response.content | length <= 262144
      - sr_callback_response.content_type is match('^application/json(?:;|$)')
      - sr_callback_response.json is mapping
      - sr_callback_response.json.get('schema_version', '') == 'serviceradar.remote_access.ssh_ca_bundle/v1'
      - sr_callback_response.json.get('action', '') == 'remote_access.ssh_ca.bundle.read'
      - >-
        sr_callback_response.json.get('job_id', 0) ==
        (lookup('ansible.builtin.env', 'JOB_ID') | int)
      - >-
        sr_callback_response.json.get('manifest_sha256', '') ==
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_MANIFEST_SHA256')
      - >-
        sr_callback_response.json.get('operation', '') ==
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_OPERATION')
      - >-
        sr_callback_response.json.get('state', '') ==
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_STATE')
      - >-
        sr_callback_response.json.get('phase', '') ==
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE')
      - sr_callback_response.json.get('authorization', {}) is mapping
      - >-
        sr_callback_response.json.authorization.keys() |
        difference(['permissions', 'policy_approved', 'binding_verified',
                    'scm_revision', 'content_sha256', 'approval_id', 'binding_id']) |
        length == 0
      - sr_callback_response.json.authorization.get('policy_approved', false) is sameas true
      - sr_callback_response.json.authorization.get('binding_verified', false) is sameas true
      - sr_callback_response.json.authorization.get('permissions', []) is sequence
      - sr_callback_response.json.authorization.get('permissions', []) is not string
      - >-
        sr_callback_response.json.authorization.get('permissions', []) |
        reject('string') | list | length == 0
      - >-
        sr_callback_response.json.authorization.get('permissions', []) | unique | length ==
        sr_callback_response.json.authorization.get('permissions', []) | length
      - "'ansible.runs.launch' in sr_callback_response.json.authorization.get('permissions', [])"
      - >-
        'devices.remote_access.ssh.ca_bundle.read' in
        sr_callback_response.json.authorization.get('permissions', [])
      - >-
        sr_callback_response.json.authorization.get('scm_revision', '') ==
        lookup('ansible.builtin.env', 'SERVICERADAR_SCM_REVISION')
      - >-
        sr_callback_response.json.authorization.get('content_sha256', '') ==
        lookup('ansible.builtin.env', 'SERVICERADAR_CONTENT_SHA256')
      - sr_callback_response.json.get('targets', []) is sequence
      - sr_callback_response.json.get('targets', []) is not string
    fail_msg: >-
      Callback response failed size, schema, authorization, operation, manifest,
      or immutable content-binding validation.
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Initialize exact target-correlation sets
  ansible.builtin.set_fact:
    _sr_cb_target_names: []
    _sr_cb_tuple_keys: []
  no_log: true
  changed_when: false
  run_once: true
  delegate_to: localhost

- name: Build exact callback target-correlation sets
  ansible.builtin.set_fact:
    _sr_cb_target_names: >-
      {{ _sr_cb_target_names + [item.inventory_hostname] }}
    _sr_cb_tuple_keys: >-
      {{ _sr_cb_tuple_keys + [
        {'controller_id': item.target_identity.controller_id,
         'inventory_id': item.target_identity.inventory_id | string,
         'awx_host_id': item.target_identity.awx_host_id | string,
         'canonical_device_uid': item.target_identity.canonical_device_uid} |
        to_json(sort_keys=true, separators=[',', ':']) | hash('sha256')] }}
  loop: "{{ sr_callback_response.json.targets }}"
  no_log: true
  changed_when: false
  run_once: true
  delegate_to: localhost

- name: Require exact play-host, manifest-target, and tuple set equality
  ansible.builtin.assert:
    that:
      - _sr_cb_target_names | length == _sr_cb_target_names | unique | length
      - _sr_cb_tuple_keys | length == _sr_cb_tuple_keys | unique | length
      - >-
        _sr_cb_target_names | sort ==
        groups['serviceradar_callback_targets'] | sort
      - >-
        sr_callback_response.json.targets | length ==
        groups['serviceradar_callback_targets'] | length
    fail_msg: >-
      The callback has a missing, extra, duplicate, or substituted host/tuple.
      The whole child is rejected before any managed-host task.
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Validate each snapshotted host correlation
  ansible.builtin.assert:
    that:
      - item.inventory_hostname in groups['serviceradar_callback_targets']
      - >-
        item.inventory_address | string ==
        hostvars[item.inventory_hostname].get('ansible_host', item.inventory_hostname) | string
      - item.target_identity is mapping
      - >-
        item.target_identity.keys() |
        difference(['controller_id', 'inventory_id', 'awx_host_id',
                    'canonical_device_uid']) | length == 0
      - item.target_identity.controller_id | length > 0
      - item.target_identity.inventory_id | string | length > 0
      - item.target_identity.awx_host_id | string | length > 0
      - item.target_identity.canonical_device_uid | length > 0
      - >-
        item.target_identity.values() | map('string') |
        reject('match', '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$') |
        list | length == 0
      - item.ca_keys is sequence
      - item.accounts is sequence
      - >-
        (item.state == 'absent' and item.ca_keys | length == 0 and
         item.accounts | length == 0) or
        (item.state == 'present' and item.ca_keys | length > 0 and
         item.accounts | length > 0)
      - >-
        item.ca_keys | selectattr('id', 'defined') | list | length ==
        item.ca_keys | length
      - >-
        item.ca_keys | rejectattr('id', 'match',
        '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') | list | length == 0
      - >-
        item.ca_keys | rejectattr('fingerprint', 'match',
        '^SHA256:[A-Za-z0-9+/]{20,60}$') | list | length == 0
      - >-
        item.ca_keys | rejectattr('public_key', 'match',
        '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/]+={0,3}( [^\\r\\n]+)?$') |
        list | length == 0
      - >-
        item.accounts | rejectattr('name', 'match',
        '^[a-z_][a-z0-9_-]{0,31}$') | list | length == 0
      - item.accounts | selectattr('name', 'equalto', 'root') | list | length == 0
      - >-
        item.accounts | map(attribute='principals') | flatten |
        reject('match', '^srp_v1_[A-Za-z0-9_-]{20,96}$') |
        list | length == 0
      - item.transaction is mapping
      - item.authorization is mapping
      - item.authorization == sr_callback_response.json.authorization
      - item.operation == lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_OPERATION')
      - item.state == lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_STATE')
      - item.phase == lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE')
      - >-
        item.keys() |
        difference(['inventory_hostname', 'inventory_address', 'target_identity',
                    'phase', 'operation', 'state', 'ca_keys', 'accounts',
                    'transaction', 'authorization', 'retirement_proof']) |
        length == 0
      - >-
        item.transaction.keys() |
        difference(['id', 'stage_job_id', 'verification_job_id', 'generation',
                    'machine_credential_ref']) | length == 0
      - >-
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE') == 'preflight' or
        item.transaction.get('machine_credential_ref', '') is
        match('^(awx|controller)-credential-ref:[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$')
      - >-
        lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE') == 'preflight' or
        (item.transaction.get('id', '') | length > 0 and
         item.transaction.get('stage_job_id', '') | string | length > 0 and
         item.transaction.get('generation', '') | length > 0 and
         item.transaction.get('machine_credential_ref', '') | length > 0)
      - >-
        item.operation == 'retire' or
        item.get('retirement_proof', {}) | length == 0
      - >-
        item.operation != 'retire' or
        (item.get('retirement_proof', {}) is mapping and
         item.retirement_proof.keys() |
         difference(['kind', 'verified', 'proof_id', 'target_identity',
                     'overlap_policy_digest', 'new_ca_fingerprint',
                     'principal_policy_version', 'fresh_until',
                     'fresh_until_epoch', 'route_id']) | length == 0)
      - >-
        item.operation != 'retire' or
        (item.retirement_proof.get('kind', '') ==
         'serviceradar_selected_edge_ca_login' and
         item.retirement_proof.get('verified', false) is sameas true and
         item.retirement_proof.get('target_identity', {}) == item.target_identity and
         item.retirement_proof.get('route_id', '') is string and
         item.retirement_proof.get('route_id', '') | length > 0 and
         item.retirement_proof.get('new_ca_fingerprint', '') is string and
         item.retirement_proof.get('principal_policy_version', '') is string and
         item.retirement_proof.get('fresh_until_epoch', 0) is integer)
    fail_msg: Callback target correlation or target policy is malformed.
  loop: "{{ sr_callback_response.json.targets }}"
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Validate exact nested callback target record schemas locally
  ansible.builtin.include_tasks: validate_target_records.yml
  loop: "{{ sr_callback_response.json.targets }}"
  loop_control:
    loop_var: sr_cb_target
  no_log: true
  run_once: true

- name: Attach only target-specific public policy to the exact play host
  ansible.builtin.add_host:
    name: "{{ item.inventory_hostname }}"
    _sr_ra_callback_ca_keys: "{{ item.ca_keys }}"
    _sr_ra_callback_accounts: "{{ item.accounts }}"
    _sr_ra_callback_target_identity: "{{ item.target_identity }}"
    _sr_ra_callback_transaction: "{{ item.transaction }}"
    _sr_ra_callback_authorization: "{{ item.authorization }}"
    _sr_ra_callback_retirement_proof: "{{ item.retirement_proof | default({}) }}"
    _sr_ra_callback_phase: "{{ item.phase }}"
    _sr_ra_callback_state: "{{ item.state }}"
    _sr_ra_callback_operation: "{{ item.operation }}"
  loop: "{{ sr_callback_response.json.targets }}"
  no_log: true
  changed_when: false
  run_once: true
  delegate_to: localhost
