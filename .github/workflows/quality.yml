---
name: remote-access-content-quality

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint-and-syntax:
    # This public repository accepts fork pull requests. Run it only on
    # GitHub-hosted runners, with no secrets; never on a runner the
    # organization operates itself.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Assert secretless GitHub-hosted runner boundary
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${ImageOS:-}" = "ubuntu24"
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          test ! -e "${HOME}/.kube/config"
          for name in \
            GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_URL KUBECONFIG KUBERNETES_SERVICE_HOST \
            VAULT_TOKEN OPENBAO_TOKEN BAO_TOKEN COSIGN_KEY COSIGN_KEY_REF \
            PLUGIN_UPLOAD_SIGNING_PRIVATE_KEY HARBOR_ROBOT_SECRET OCI_TOKEN \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              echo "forbidden privileged environment variable is present: ${name}" >&2
              exit 1
            fi
          done
          printf 'runner_environment=%s\n' "${RUNNER_ENVIRONMENT}"
          printf 'runner_image=%s %s\n' "${ImageOS}" "${ImageVersion:-unknown}"
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Record immutable source provenance
        run: |
          set -euo pipefail
          printf 'source_commit=%s\n' "${GITHUB_SHA}"
          sha256sum requirements-ci.lock
      - name: Select the Python version the lock was resolved for
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact reviewed lint dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-ci.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install exact reviewed Ansible collection dependencies
        run: |
          set -euo pipefail
          .venv/bin/ansible-galaxy collection install \
            --collections-path .collections --requirements-file requirements.yml
      - name: Install exact ShellCheck gate from the Ubuntu 24.04 archive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends --allow-downgrades shellcheck=0.9.0-1
          hash -r
          test "$(shellcheck --version | awk '/^version:/ {print $2}')" = "0.9.0"
      - name: Run repository, YAML, Ansible lint, and every wrapper syntax gate
        run: scripts/check.sh
      - name: Build collection artifact and record immutable content provenance
        run: |
          set -euo pipefail
          install -d dist
          ansible-galaxy collection build --force --output-path dist
          python scripts/content_digest.py
          sha256sum dist/*.tar.gz

  molecule-systemd-sshd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [preflight]
    steps:
      - name: Assert secretless GitHub-hosted runner boundary
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${ImageOS:-}" = "ubuntu24"
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          test ! -e "${HOME}/.kube/config"
          for name in \
            GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_URL KUBECONFIG KUBERNETES_SERVICE_HOST \
            VAULT_TOKEN OPENBAO_TOKEN BAO_TOKEN COSIGN_KEY COSIGN_KEY_REF \
            PLUGIN_UPLOAD_SIGNING_PRIVATE_KEY HARBOR_ROBOT_SECRET OCI_TOKEN \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              echo "forbidden privileged environment variable is present: ${name}" >&2
              exit 1
            fi
          done
          printf 'runner_environment=%s\n' "${RUNNER_ENVIRONMENT}"
          printf 'runner_image=%s %s\n' "${ImageOS}" "${ImageVersion:-unknown}"
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Record immutable source and platform provenance
        run: |
          set -euo pipefail
          printf 'source_commit=%s\n' "${GITHUB_SHA}"
          sha256sum requirements-ci.lock
          mapfile -t platform_images < <(
            awk '/^[[:space:]]+docker\.io\/.*@sha256:[0-9a-f]+$/ {
              sub(/^[[:space:]]+/, "")
              print
            }' molecule/preflight/molecule.yml
          )
          test "${#platform_images[@]}" -eq 4
          printf 'platform_image=%s\n' "${platform_images[@]}"
      - name: Verify the single-job runner's own Docker daemon
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          docker info
          test -z "$(docker ps --all --quiet)"
      - name: Select the Python version the lock was resolved for
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact reviewed test dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-ci.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install exact reviewed Ansible collection dependencies
        run: |
          set -euo pipefail
          .venv/bin/ansible-galaxy collection install \
            --collections-path .collections --requirements-file requirements.yml
      - name: Install exact reviewed Molecule Docker driver collections
        run: |
          set -euo pipefail
          .venv/bin/ansible-galaxy collection install \
            --collections-path .collections \
            --requirements-file molecule/preflight/collections.yml
      - name: Unload the host AppArmor profile that confines the fixtures' PAM helper
        run: |
          set -euo pipefail
          # The runner's unix-chkpwd profile also attaches to that helper inside
          # the privileged fixture containers and denies it dac_override and
          # dac_read_search. The Rocky fixture keeps /etc/shadow at mode 0000,
          # so sudo then fails its PAM account check for root. Unload only this
          # profile, only on this single-job runner; the fixtures stay stock.
          profiles=/sys/kernel/security/apparmor/profiles
          if sudo grep -q '^unix-chkpwd ' "${profiles}"; then
            sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd
          fi
          if sudo grep -q '^unix-chkpwd ' "${profiles}"; then
            echo "the unix-chkpwd AppArmor profile is still loaded" >&2
            exit 1
          fi
      - name: Generate an ephemeral uncommitted test CA and run pinned Molecule matrix
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          trap 'molecule destroy -s "${MOLECULE_SCENARIO}" >/dev/null 2>&1 || true' EXIT
          molecule test -s "${MOLECULE_SCENARIO}"
