---
- name: Require both pinned artifact inputs together
  ansible.builtin.assert:
    that:
      - (serviceradar_agent_package_url is defined) == (serviceradar_agent_package_sha256 is defined)
    fail_msg: >-
      Supply serviceradar_agent_package_url and serviceradar_agent_package_sha256
      together, plus serviceradar_version, or omit both to discover a GitHub release.

- name: Select pinned artifact or GitHub release discovery
  ansible.builtin.set_fact:
    serviceradar_use_pinned_package: "{{ serviceradar_agent_package_url is defined }}"

- name: Validate the pinned artifact contract
  ansible.builtin.assert:
    that:
      - serviceradar_agent_package_url is string
      - serviceradar_agent_package_url is match('^https?://[^\s]+$')
      - serviceradar_agent_package_sha256 is string
      - serviceradar_agent_package_sha256 is match('^[A-Fa-f0-9]{64}$')
      - serviceradar_version is defined
      - serviceradar_version | default('') is string
      - serviceradar_version | default('') is match('^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$')
    fail_msg: >-
      Pinned packages require an HTTP(S) artifact URL, a 64-character SHA-256,
      and an explicit serviceradar_version matching the package version.
  when: serviceradar_use_pinned_package

- name: Resolve release endpoint
  ansible.builtin.set_fact:
    serviceradar_release_url: >-
      {{ serviceradar_api_base }}/releases/{{
        'tags/v' ~ (serviceradar_version | regex_replace('^v', ''))
        if serviceradar_version is defined
        else 'latest' }}
  when: not serviceradar_use_pinned_package

# Release metadata does not depend on the managed host, so the controller asks
# once per distinct release for the whole batch. Managed hosts behind a shared
# address would otherwise each spend the same anonymous GitHub API allowance.
# The loop is empty, and no request is made, when every host is pinned.
- name: Fetch release metadata from GitHub once on the controller
  ansible.builtin.uri:
    url: "{{ item }}"
    return_content: true
    validate_certs: "{{ serviceradar_validate_certs }}"
  loop: >-
    {{ ansible_play_batch | map('extract', hostvars)
       | selectattr('serviceradar_use_pinned_package', 'defined')
       | rejectattr('serviceradar_use_pinned_package')
       | map(attribute='serviceradar_release_url') | unique | list }}
  register: serviceradar_release_lookup
  # Every response is classified below so that each failure names its cause.
  # Only a transport error or a server error is worth asking again.
  failed_when: false
  retries: 3
  delay: 5
  until: >-
    (serviceradar_release_lookup.status | default(-1) >= 200 and
     serviceradar_release_lookup.status | default(-1) < 500) or
    serviceradar_release_lookup.attempts | default(3) >= 3
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false

- name: Require usable release metadata
  when: not serviceradar_use_pinned_package
  block:
    - name: Select the release metadata requested for this host
      ansible.builtin.set_fact:
        serviceradar_release: >-
          {{ serviceradar_release_lookup.results
             | selectattr('item', 'equalto', serviceradar_release_url) | first }}

    - name: Require a GitHub API response that is not rate limited
      ansible.builtin.assert:
        that:
          - >-
            serviceradar_release.status not in [403, 429] or
            (serviceradar_release.x_ratelimit_remaining | default('') | string != '0' and
             serviceradar_release.retry_after is not defined)
        fail_msg: >-
          GitHub rate limited the release lookup from the Ansible controller
          (HTTP {{ serviceradar_release.status }} for {{ serviceradar_release_url }};
          requests remaining {{ serviceradar_release.x_ratelimit_remaining | default('not reported') }};
          limit resets at {{ '%Y-%m-%d %H:%M:%S UTC'
             | strftime(serviceradar_release.x_ratelimit_reset, utc=true)
             if serviceradar_release.x_ratelimit_reset | default('') | string is match('^[0-9]+$')
             else 'an unreported time' }}).
          Anonymous GitHub API requests are limited per source address and the
          controller shares its address with other clients. Retry after the
          reset, or skip release discovery by supplying
          serviceradar_agent_package_url, serviceradar_agent_package_sha256,
          and serviceradar_version.

    - name: Require a definitive answer from the GitHub release API
      ansible.builtin.assert:
        that:
          - serviceradar_release.status in [200, 404]
        fail_msg: >-
          The release lookup from the Ansible controller did not get a usable
          answer from {{ serviceradar_release_url }}
          (HTTP status {{ serviceradar_release.status }}:
          {{ serviceradar_release.msg | default('no detail reported') }}).
          Check that the controller can reach the GitHub API, or skip release
          discovery by supplying serviceradar_agent_package_url,
          serviceradar_agent_package_sha256, and serviceradar_version.

    - name: Require a published GitHub release with package assets
      ansible.builtin.assert:
        that:
          - serviceradar_release.status == 200
          - serviceradar_release.json is defined
          - serviceradar_release.json is mapping
          - serviceradar_release.json.tag_name is defined
          - serviceradar_release.json.assets | default([]) | length > 0
        fail_msg: >-
          No published ServiceRadar GitHub release with package assets is
          available for this version. Supply a reviewed package using
          serviceradar_agent_package_url, serviceradar_agent_package_sha256,
          and serviceradar_version.

- name: Record the exact target package version
  ansible.builtin.set_fact:
    serviceradar_target_version: >-
      {{ (serviceradar_version if serviceradar_use_pinned_package
          else serviceradar_release.json.tag_name) | regex_replace('^v', '') }}

- name: Validate target package version
  ansible.builtin.assert:
    that:
      - serviceradar_target_version is match('^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$')
    fail_msg: The selected release must have a supported semantic package version.

- name: Use the pinned artifact without release discovery
  ansible.builtin.set_fact:
    serviceradar_package_download_url: "{{ serviceradar_agent_package_url }}"
    serviceradar_package_checksum: "sha256:{{ serviceradar_agent_package_sha256 | lower }}"
  when: serviceradar_use_pinned_package

- name: Select the release package for this architecture
  when: not serviceradar_use_pinned_package
  block:
    - name: Select matching release package assets
      ansible.builtin.set_fact:
        serviceradar_matched_assets: >-
          {{ serviceradar_release.json.assets
             | selectattr('name', 'match', serviceradar_agent_asset_pattern)
             | list }}

    - name: Require exactly one matching release package
      ansible.builtin.assert:
        that:
          - serviceradar_matched_assets | length == 1
        fail_msg: >-
          Release {{ serviceradar_release.json.tag_name }} must publish exactly
          one serviceradar-agent {{ serviceradar_package_extension }} package
          for {{ serviceradar_package_arch }}. Supply a pinned package URL,
          SHA-256, and version if no matching release asset is available.

    - name: Select the optional published checksum sidecar
      ansible.builtin.set_fact:
        serviceradar_checksum_assets: >-
          {{ serviceradar_release.json.assets
             | selectattr('name', 'equalto', serviceradar_matched_assets[0].name ~ '.sha256')
             | list }}

    - name: Record release artifact URL and available checksum
      ansible.builtin.set_fact:
        serviceradar_package_download_url: "{{ serviceradar_matched_assets[0].browser_download_url }}"
        serviceradar_package_checksum: >-
          {{ ('sha256:' ~ serviceradar_checksum_assets[0].browser_download_url)
             if serviceradar_checksum_assets | length > 0 else '' }}

- name: Record the target-local package download path
  ansible.builtin.set_fact:
    serviceradar_package_download_path: >-
      {{ '/tmp/serviceradar-agent-' ~ serviceradar_target_version ~ '-'
         ~ serviceradar_package_arch ~ '.' ~ serviceradar_package_extension }}
