---
- name: Bind this wrapper to integrated removal verification
  hosts: all
  gather_facts: false
  tasks:
    - name: Require callback credential intent for this exact wrapper
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_PHASE') == 'verify'
          - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_STATE') == 'absent'
          - lookup('ansible.builtin.env', 'SERVICERADAR_CALLBACK_OPERATION') == 'remove'
      run_once: true
      delegate_to: localhost

- name: Load integrated offboarding verification
  ansible.builtin.import_playbook: playbooks/integrated.yml
