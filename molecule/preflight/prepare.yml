---
# TEMPORARY DIAGNOSTIC (removed before merge): find why sudo's PAM account
# check fails for root in the privileged systemd Rocky fixture.
- name: Diagnose the Rocky fixture sudo PAM account failure
  hosts: sr-ra-rocky9
  gather_facts: false
  tasks:
    - name: Collect sudo, PAM, shadow, and kernel-denial evidence
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          exec 2>&1
          echo "== id"; id; grep -E '^Cap(Eff|Bnd)' /proc/self/status
          echo "== lsm label"; cat /proc/self/attr/current; echo
          echo "== system state"; systemctl is-system-running
          echo "== shadow"; ls -ln /etc/shadow; rpm -q pam sudo
          echo "== selinux"; ls /sys/fs/selinux 2>&1 | head -3; grep selinux /proc/filesystems
          echo "== sudo before"; sudo -n true; echo "rc=$?"
          echo "== unix_chkpwd"; /usr/sbin/unix_chkpwd root chkexpiry; echo "rc=$?"
          echo "== journal"; journalctl -b --no-pager -n 200 | grep -Ei 'pam|sudo|unix_chkpwd' | tail -n 15
          echo "== dmesg denials"; dmesg | grep -Ei 'apparmor|audit' | tail -n 12
          echo "== sudo with owner-readable shadow"
          chmod 0400 /etc/shadow; sudo -n true; echo "rc=$?"; chmod 0000 /etc/shadow
          echo "== sudo after restore"; sudo -n true; echo "rc=$?"
          exit 0
      register: molecule_sudo_diagnostic
      changed_when: false

    - name: Show the evidence
      ansible.builtin.debug:
        var: molecule_sudo_diagnostic.stdout_lines

- name: Prepare real systemd and sshd fixtures
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Refresh the fixture package index, which the images ship empty
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install OpenSSH server fixture package
      ansible.builtin.package:
        name: openssh-server
        state: present

    - name: Ensure standard sshd drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Detect standard sshd drop-in include
      ansible.builtin.command:
        argv: [grep, -E, '^Include /etc/ssh/sshd_config.d/\*\.conf$', /etc/ssh/sshd_config]
      register: molecule_sshd_include
      changed_when: false
      failed_when: false

    - name: Add the distribution-standard include to fixture only
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: Include /etc/ssh/sshd_config.d/*.conf
        insertbefore: BOF
      when: molecule_sshd_include.rc != 0

    - name: Create an existing non-root fixture account
      ansible.builtin.user:
        name: srtest
        shell: /bin/sh
        create_home: true

    - name: Create private ephemeral CA directory inside one disposable fixture
      ansible.builtin.file:
        path: /run/serviceradar-test-ca
        state: directory
        owner: root
        group: root
        mode: "0700"
      run_once: true

    - name: Generate ephemeral test CA inside the disposable fixture
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -f
          - /run/serviceradar-test-ca/ca
        creates: /run/serviceradar-test-ca/ca
      no_log: true
      run_once: true

    - name: Fetch only the ephemeral public test CA to the Molecule controller
      ansible.builtin.fetch:
        src: /run/serviceradar-test-ca/ca.pub
        dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/test-ca.pub"
        flat: true
      run_once: true

    - name: Start the real fixture SSH daemon
      ansible.builtin.systemd_service:
        name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        enabled: true
        state: started

- name: Confirm only the public ephemeral test CA left the fixture
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify ephemeral public test key exists
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/test-ca.pub"
      register: molecule_test_ca_public

    - name: Require fixture-generated public test key
      ansible.builtin.assert:
        that: molecule_test_ca_public.stat.isreg | default(false)
