---
- name: "Alter the crypto-policy back-end: {{ molecule_backend_case.case }}"
  ansible.builtin.copy:
    dest: "{{ molecule_backend }}"
    content: "{{ molecule_backend_case.content }}"
    owner: root
    group: root
    mode: "{{ molecule_backend_case.mode }}"

- name: "Expect rejection: {{ molecule_backend_case.case }}"
  ansible.builtin.include_tasks: expect_rejection.yml
  vars:
    rejection_case: "{{ molecule_backend_case.case }}"
    rejection_task: "{{ molecule_backend_rule }}"
