---
- name: "Restore then alter the main sshd configuration: {{ molecule_mainconfig_case.case }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      cat "{{ molecule_backup_dir }}/sshd_config" > /etc/ssh/sshd_config
      printf '%s\n' {{ molecule_mainconfig_case.line | quote }} >> /etc/ssh/sshd_config
  changed_when: true

- name: "Expect rejection: {{ molecule_mainconfig_case.case }}"
  ansible.builtin.include_tasks: expect_rejection.yml
  vars:
    rejection_case: "{{ molecule_mainconfig_case.case }}"
    rejection_task: "{{ molecule_mainconfig_case.rule | default(molecule_mainconfig_rule) }}"
