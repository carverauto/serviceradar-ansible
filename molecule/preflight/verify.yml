---
# TEMPORARY PROBE (removed before merge): record which keyword/argument
# separator forms each fixture's real sshd accepts in a drop-in.
- name: Probe sshd keyword separator forms
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run each form through sshd -t and sshd -T
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          d=/run/sr-probe
          rm -rf /run/sr-probe; mkdir -p "$d/d"
          printf 'Include %s/d/*.conf\n' "$d" > "$d/sshd_config"
          printf 'TrustedUserCAKeys %s/included-ca.pub\n' "$d" > "$d/inc.conf"
          /usr/sbin/sshd -V 2>&1 | head -n 1
          probe() {
            printf '%s\n' "$2" > "$d/d/50-probe.conf"
            if [ -n "${3:-}" ]; then printf '%s\n' "$3" >> "$d/d/50-probe.conf"; fi
            /usr/sbin/sshd -t -f "$d/sshd_config" >/dev/null 2>"$d/err"; rc=$?
            ctx=user=srtest,host=localhost,addr=127.0.0.1
            eff=$(/usr/sbin/sshd -T -f "$d/sshd_config" -C "$ctx" 2>/dev/null |
                  grep -E '^(trustedusercakeys|authorizedprincipalsfile) ' | tr '\n' ';')
            err=$(head -c 110 "$d/err" | tr '\n' ' ')
            printf 'FORM %-22s rc=%s effective=[%s] err=[%s]\n' "$1" "$rc" "$eff" "$err"
          }
          probe include-space     "Include $d/inc.conf"
          probe include-equals    "Include=$d/inc.conf"
          probe include-sp-eq-sp  "Include = $d/inc.conf"
          probe include-quoted    "Include \"$d/inc.conf\""
          probe include-noquotesp "Include\"$d/inc.conf\""
          probe include-dbl-eq    "Include==$d/inc.conf"
          probe kw-quoted-include "\"Include\" $d/inc.conf"
          probe ca-equals         "TrustedUserCAKeys=$d/ca.pub"
          probe ca-sp-eq-sp       "TrustedUserCAKeys = $d/ca.pub"
          probe ca-quoted         "TrustedUserCAKeys \"$d/ca.pub\""
          probe ca-eq-quoted      "TrustedUserCAKeys=\"$d/ca.pub\""
          probe ca-noquotesp      "TrustedUserCAKeys\"$d/ca.pub\""
          probe kw-quoted-ca      "\"TrustedUserCAKeys\" $d/ca.pub"
          probe ca-quoted-space   "TrustedUserCAKeys \"$d/ca with space.pub\""
          probe principals-equals "AuthorizedPrincipalsFile=$d/p/%u"
          probe principals-sp-eq  "AuthorizedPrincipalsFile = $d/p/%u"
          probe principals-quoted "AuthorizedPrincipalsFile \"$d/p/%u\""
          probe match-space       "Match User srtest" "TrustedUserCAKeys $d/match-ca.pub"
          probe match-equals      "Match=User srtest" "TrustedUserCAKeys $d/match-ca.pub"
          probe match-sp-eq-sp    "Match = User srtest" "TrustedUserCAKeys $d/match-ca.pub"
          probe match-user-equals "Match User=srtest" "TrustedUserCAKeys $d/match-ca.pub"
          probe kw-quoted-match   "\"Match\" User srtest" "TrustedUserCAKeys $d/match-ca.pub"
          rm -rf /run/sr-probe
          exit 0
      register: molecule_separator_probe
      changed_when: false

    - name: Show the probe results
      ansible.builtin.debug:
        var: molecule_separator_probe.stdout_lines

- name: Verify preflight made no role-owned host changes
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check role-owned policy paths remain absent
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/ssh/serviceradar/current/trusted-user-ca-keys.pub
        - /etc/ssh/serviceradar/current/authorized-principals
        - /etc/ssh/sshd_config.d/10-serviceradar-remote-access.conf
      register: molecule_owned_paths

    - name: Assert platform identity and read-only behavior
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == expected_distribution
          - ansible_facts['distribution_major_version'] == expected_version.split('.')[0]
          - molecule_owned_paths.results | selectattr('stat.exists') | list | length == 0

    - name: Revalidate real sshd after preflight
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t, -f, /etc/ssh/sshd_config]
      changed_when: false

- name: Prove the stock crypto-policy Include allowance stays narrow
  hosts: sr-ra-rocky9
  become: true
  gather_facts: true
  vars_files:
    - vars/role_inputs.yml
  vars:
    molecule_stock_dropin: /etc/ssh/sshd_config.d/50-redhat.conf
    molecule_stock_include: Include /etc/crypto-policies/back-ends/opensshserver.config
    molecule_backend: /etc/crypto-policies/back-ends/opensshserver.config
    molecule_backup_dir: /run/serviceradar-test-preflight
    molecule_dropin_rule: Reject ambiguous Match or CA directives in unmanaged drop-ins
    molecule_mainconfig_rule: Validate supported include and Match layout
    molecule_backend_read: Read the included system-wide crypto-policy back-end
    molecule_backend_rule: Reject Include, Match, or CA directives in the crypto-policy back-end
  tasks:
    - name: Require the unmodified fixture to carry the stock Include exactly once
      ansible.builtin.command:
        argv: [grep, -c, -x, "{{ molecule_stock_include }}", "{{ molecule_stock_dropin }}"]
      register: molecule_stock_include_count
      changed_when: false
      failed_when: molecule_stock_include_count.stdout != '1'

    - name: Require the stock back-end to be the distribution symlink
      ansible.builtin.stat:
        path: "{{ molecule_backend }}"
        follow: false
      register: molecule_backend_link
      failed_when: not (molecule_backend_link.stat.islnk | default(false))

    - name: Create a private backup directory inside the disposable fixture
      ansible.builtin.file:
        path: "{{ molecule_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Back up the stock drop-in
      ansible.builtin.copy:
        src: "{{ molecule_stock_dropin }}"
        dest: "{{ molecule_backup_dir }}/50-redhat.conf"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Reject each altered stock drop-in
      ansible.builtin.include_tasks: tasks/dropin_case.yml
      loop:
        - case: a second Include in the stock drop-in
          content: |
            {{ molecule_stock_include }}
            Include /etc/ssh/site-policy.conf
        - case: the stock Include repeated in the stock drop-in
          content: |
            {{ molecule_stock_include }}
            {{ molecule_stock_include }}
        - case: a different Include path in the stock drop-in
          content: |
            Include /etc/crypto-policies/back-ends/openssh.config
        - case: a second path on the stock Include line
          content: |
            {{ molecule_stock_include }} /etc/ssh/site-policy.conf
        - case: a CA directive beside the stock Include
          content: |
            {{ molecule_stock_include }}
            TrustedUserCAKeys /etc/ssh/site-ca.pub
        - case: a Match block beside the stock Include
          content: |
            {{ molecule_stock_include }}
            Match User srtest
                X11Forwarding no
        - case: the equals form of the stock Include
          content: |
            Include={{ molecule_backend }}
        - case: the spaced equals form of the stock Include
          content: |
            Include = {{ molecule_backend }}
        - case: the quoted form of the stock Include
          content: |
            Include "{{ molecule_backend }}"
        - case: an equals-form Include beside the stock Include
          content: |
            {{ molecule_stock_include }}
            Include=/etc/ssh/site-policy.conf
        - case: an equals-form CA directive beside the stock Include
          content: |
            {{ molecule_stock_include }}
            TrustedUserCAKeys=/etc/ssh/site-ca.pub
        - case: a spaced equals-form principals directive beside the stock Include
          content: |
            {{ molecule_stock_include }}
            AuthorizedPrincipalsFile = /etc/ssh/site-principals/%u
        - case: a quoted-keyword CA directive beside the stock Include
          content: |
            {{ molecule_stock_include }}
            "TrustedUserCAKeys" /etc/ssh/site-ca.pub
        - case: an equals-form Match beside the stock Include
          content: |
            {{ molecule_stock_include }}
            Match=User srtest
                X11Forwarding no
      loop_control:
        loop_var: molecule_dropin_case
        label: "{{ molecule_dropin_case.case }}"

    - name: Restore the stock drop-in
      ansible.builtin.copy:
        src: "{{ molecule_backup_dir }}/50-redhat.conf"
        dest: "{{ molecule_stock_dropin }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Back up the main sshd configuration
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: "{{ molecule_backup_dir }}/sshd_config"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Reject each altered main sshd configuration
      ansible.builtin.include_tasks: tasks/mainconfig_case.yml
      loop:
        - case: an equals-form Include in the main sshd configuration
          line: Include=/etc/ssh/site-policy.conf
        - case: a quoted Include in the main sshd configuration
          line: Include "/etc/ssh/site-policy.conf"
        - case: an equals-form Match in the main sshd configuration
          line: Match=User srtest
      loop_control:
        loop_var: molecule_mainconfig_case
        label: "{{ molecule_mainconfig_case.case }}"

    - name: Restore the main sshd configuration in place, keeping its mode
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          cat "{{ molecule_backup_dir }}/sshd_config" > /etc/ssh/sshd_config
      changed_when: true

    - name: Add the stock Include line to a differently named drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/40-site.conf
        content: |
          {{ molecule_stock_include }}
        owner: root
        group: root
        mode: "0600"

    - name: Reject the stock Include line outside the stock drop-in
      ansible.builtin.include_tasks: tasks/expect_rejection.yml
      vars:
        rejection_case: the stock Include line in a differently named drop-in
        rejection_task: "{{ molecule_dropin_rule }}"
        rejection_sources: [/etc/ssh/sshd_config.d/40-site.conf]

    - name: Remove the differently named drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/40-site.conf
        state: absent

    - name: Move the stock back-end symlink aside
      ansible.builtin.command:
        argv: [mv, "{{ molecule_backend }}", "{{ molecule_backup_dir }}/opensshserver.config"]
        creates: "{{ molecule_backup_dir }}/opensshserver.config"

    - name: Reject a missing crypto-policy back-end
      ansible.builtin.include_tasks: tasks/expect_rejection.yml
      vars:
        rejection_case: a missing crypto-policy back-end
        rejection_task: "{{ molecule_backend_read }}"

    - name: Reject each altered crypto-policy back-end
      ansible.builtin.include_tasks: tasks/backend_case.yml
      loop:
        - case: a CA directive in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            TrustedUserCAKeys /etc/ssh/site-ca.pub
          mode: "0644"
        - case: a principals directive in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            AuthorizedPrincipalsFile /etc/ssh/site-principals/%u
          mode: "0644"
        - case: a Match block in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            Match User srtest
                X11Forwarding no
          mode: "0644"
        - case: a nested Include in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            Include /etc/ssh/site-policy.conf
          mode: "0644"
        - case: an equals-form CA directive in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            TrustedUserCAKeys=/etc/ssh/site-ca.pub
          mode: "0644"
        - case: an equals-form Include in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            Include = /etc/ssh/site-policy.conf
          mode: "0644"
        - case: a quoted-keyword principals directive in the crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
            "AuthorizedPrincipalsFile" /etc/ssh/site-principals/%u
          mode: "0644"
        - case: a group-writable crypto-policy back-end
          content: |
            Ciphers aes256-gcm@openssh.com
          mode: "0664"
      loop_control:
        loop_var: molecule_backend_case
        label: "{{ molecule_backend_case.case }}"

    - name: Remove the altered crypto-policy back-end
      ansible.builtin.file:
        path: "{{ molecule_backend }}"
        state: absent

    - name: Restore the stock back-end symlink
      ansible.builtin.command:
        argv: [mv, "{{ molecule_backup_dir }}/opensshserver.config", "{{ molecule_backend }}"]
        creates: "{{ molecule_backend }}"

    - name: Accept the restored stock fixture, proving each rejection came from its alteration
      ansible.builtin.include_role:
        name: remote_access_ssh_ca
