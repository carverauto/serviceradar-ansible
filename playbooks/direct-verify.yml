---
- name: Direct controller fresh SSH session verification
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Discard any controller connection persisted from staging
      ansible.builtin.meta: reset_connection

    - name: Prove a new automation connection and gather target facts
      ansible.builtin.setup:

    - name: Verify the staged generation from a separate SSH job
      ansible.builtin.include_role:
        name: remote_access_ssh_ca
      vars:
        sr_ra_mode: direct
        sr_ra_phase: verify
        sr_ra_state: "{{ direct_verify_state | default('present') }}"
        sr_ra_operation: "{{ direct_verify_operation | default('enroll') }}"
