---
- name: Direct controller commit verified SSH CA generation
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Commit the exact verified generation
      ansible.builtin.include_role:
        name: remote_access_ssh_ca
      vars:
        sr_ra_mode: direct
        sr_ra_phase: commit
        sr_ra_state: "{{ direct_commit_state | default('present') }}"
        sr_ra_operation: "{{ direct_commit_operation | default('enroll') }}"
