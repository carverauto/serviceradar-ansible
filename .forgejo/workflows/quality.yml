---
name: remote-access-content-quality

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-syntax:
    # The organization-wide ubuntu24 pool uses disposable DinD-backed workers;
    # this workflow does not request signing labels or repository credentials.
    runs-on: [ubuntu24]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact reviewed lint dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --require-hashes -r requirements-ci.lock
      - name: Run repository, YAML, Ansible lint, and every wrapper syntax gate
        run: scripts/check.sh
      - name: Build collection artifact and record immutable content provenance
        run: |
          set -euo pipefail
          install -d dist
          ansible-galaxy collection build --force --output-path dist
          python scripts/content_digest.py
          sha256sum dist/*.tar.gz

  molecule-systemd-sshd:
    runs-on: [ubuntu24]
    strategy:
      fail-fast: false
      matrix:
        scenario: [preflight]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact reviewed test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --require-hashes -r requirements-ci.lock
      - name: Verify disposable Docker daemon
        run: docker info
      - name: Generate an ephemeral uncommitted test CA and run Molecule
        run: |
          set -euo pipefail
          trap 'molecule destroy -s "${{ matrix.scenario }}" >/dev/null 2>&1 || true' EXIT
          molecule test -s "${{ matrix.scenario }}"
