---
# Install from a GitHub release or an explicit URL + SHA-256 + version tuple.
# See README.md for pinned artifact inputs and separate agent enrollment.
- name: Install ServiceRadar agent (RHEL/Rocky/Alma/Fedora)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  vars:
    serviceradar_api_base: "https://api.github.com/repos/carverauto/serviceradar"
    serviceradar_validate_certs: true
    serviceradar_service_name: serviceradar-agent
    serviceradar_package_name: serviceradar-agent
    serviceradar_package_extension: rpm
    serviceradar_arch_map:
      x86_64: x86_64
      aarch64: aarch64
      arm64: aarch64
    serviceradar_package_arch: >-
      {{ serviceradar_arch_map[ansible_facts['architecture']]
         | default(ansible_facts['architecture']) }}
    serviceradar_agent_asset_pattern: >-
      ^serviceradar-agent-{{ serviceradar_target_version | regex_escape }}.*\.{{ serviceradar_package_arch }}\.rpm$

  tasks:
    - name: Verify the target operating system family
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
        fail_msg: >-
          {{ inventory_hostname }} reports os_family
          {{ ansible_facts['os_family'] }}; use install-agent-debian.yml
          for apt-based hosts.

    - name: Resolve the exact agent artifact
      ansible.builtin.import_tasks: tasks/agent_artifact.yml

    - name: Query installed serviceradar-agent version
      ansible.builtin.command:
        argv:
          - rpm
          - --query
          - --queryformat
          - "%{VERSION}"
          - "{{ serviceradar_package_name }}"
      register: serviceradar_package_query
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record installed version
      ansible.builtin.set_fact:
        serviceradar_installed_version: >-
          {{ (serviceradar_package_query.stdout | trim)
             if serviceradar_package_query.rc == 0 else '' }}

    - name: Reconcile the installed package artifact identity
      ansible.builtin.import_tasks: tasks/agent_package_identity.yml

    - name: Download and install serviceradar-agent {{ serviceradar_target_version }}
      when: serviceradar_package_install_required
      block:
        - name: Download the selected agent package
          ansible.builtin.get_url:
            url: "{{ serviceradar_package_download_url }}"
            dest: "{{ serviceradar_package_download_path }}"
            mode: "0644"
            validate_certs: "{{ serviceradar_validate_certs }}"
            checksum: "{{ serviceradar_package_checksum | default(omit, true) }}"
          register: serviceradar_download
          retries: 3
          delay: 5
          until: serviceradar_download is succeeded

        # Check mode never downloads the package, so there is no file to hand
        # to the package manager. The final report states the planned action.
        - name: Install agent package via dnf/yum
          ansible.builtin.package:
            name: "{{ serviceradar_package_download_path }}"
            state: present
          when: not ansible_check_mode

        # Package modules skip an already-installed version; reinstall the exact pin.
        - name: Reinstall a changed pinned artifact at the same version
          ansible.builtin.command: # noqa command-instead-of-module
            argv:
              - "{{ ansible_facts['pkg_mgr'] }}"
              - -y
              - reinstall
              - "{{ serviceradar_package_download_path }}"
          changed_when: true
          when: serviceradar_reinstall_pinned_package

        - name: Remove downloaded package file
          ansible.builtin.file:
            path: "{{ serviceradar_package_download_path }}"
            state: absent

    - name: Verify the installed package version
      ansible.builtin.command:
        argv:
          - rpm
          - --query
          - --queryformat
          - "%{VERSION}"
          - "{{ serviceradar_package_name }}"
      register: serviceradar_installed_package
      changed_when: false
      failed_when: >-
        serviceradar_installed_package.rc != 0 or
        serviceradar_installed_package.stdout | trim != serviceradar_target_version
      when: not ansible_check_mode

    - name: Record the verified pinned package SHA-256
      ansible.builtin.copy:
        dest: /etc/serviceradar/agent-package.sha256
        content: "{{ serviceradar_agent_package_sha256 | lower }}\n"
        owner: root
        group: root
        mode: "0644"
      when:
        - serviceradar_use_pinned_package
        - not ansible_check_mode

    - name: Reconcile agent service and enrollment readiness
      ansible.builtin.import_tasks: tasks/agent_service.yml
